name: test
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      # packs must still equal the Studio Lab 1 genres they came from
      - uses: actions/checkout@v4
        with:
          repository: kefirman9000/studio-lab
          path: _sl1
      - run: SL1_PATH=_sl1 python -m pytest -q tests/test_packs.py -k equal_v1
